name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Unit tests
        run: dotnet test tests/ProductCosting.Tests -c Release --logger "console;verbosity=normal"

      - name: Publish ProductCosting.exe (self-contained, single file)
        run: >
          dotnet publish src/ProductCosting.App -c Release -r win-x64 --self-contained
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Full-HD screen for the smoke test
        shell: pwsh
        continue-on-error: true
        run: Set-DisplayResolution -Width 1920 -Height 1080 -Force

      - name: Smoke test (opens every screen on demo data)
        shell: pwsh
        run: |
          # run the exe alone in an empty folder, exactly as it is downloaded
          $dir = Join-Path $env:RUNNER_TEMP 'smoke'
          $app = Join-Path $env:RUNNER_TEMP 'app'
          New-Item -ItemType Directory -Force $app | Out-Null
          Copy-Item publish\ProductCosting.exe $app
          $p = Start-Process -FilePath (Join-Path $app 'ProductCosting.exe') -WorkingDirectory $app -ArgumentList '--smoke', "`"$dir`"" -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Write-Host 'timeout' }
          Get-Content (Join-Path $dir 'smoke.log')
          if ($p.ExitCode -ne 0) { Write-Error "smoke test failed ($($p.ExitCode))"; exit 1 }

      # manual runs only: publish each screenshot as a check run, so it can be reviewed without downloading artifacts
      - name: Publish screenshots
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs'), path = require('path');
            const dir = path.join(process.env.RUNNER_TEMP, 'smoke', 'shots');
            if (!fs.existsSync(dir)) return;
            for (const f of fs.readdirSync(dir).filter(f => f.endsWith('.b64')).sort()) {
              await github.rest.checks.create({
                owner: context.repo.owner, repo: context.repo.repo, head_sha: context.sha,
                name: 'screenshot ' + f.replace('.b64', ''), status: 'completed', conclusion: 'neutral',
                output: { title: f, summary: 'base64 JPEG', text: fs.readFileSync(path.join(dir, f), 'utf8') },
              });
            }

      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-results
          path: |
            ${{ runner.temp }}/smoke/shots/*.png
            ${{ runner.temp }}/smoke/*.pdf
            ${{ runner.temp }}/smoke/smoke.log

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: ProductCosting-win-x64
          path: publish/ProductCosting.exe
